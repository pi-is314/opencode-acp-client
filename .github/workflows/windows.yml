name: windows

# The unit suite on Windows, through PowerShell — GitHub's default shell on
# windows-latest. The real-TUI acceptance cannot run here (no tmux), so this job
# covers typecheck + unit tests only; see docs/COMPAT-OPENCODE.md for the platform
# notes.
#
# Why it matters: `AcpClient` has a Windows-only branch (no process groups;
# `taskkill /T` instead) and the path/quoting assumptions elsewhere are POSIX in
# spirit. A green Unix run says nothing about those.
#
# ★ It runs on every push and pull request now. It spent a while as `workflow_dispatch`
# only, because its first real run failed 10 of 402 tests and the fixes were done against a
# Windows 11 VM rather than through CI: a permanently red job is one nobody reads, which is
# how a genuine regression slips through later.
#
# What that VM found, all of it real (the tests were fine — the assumptions were POSIX):
#
#   • `spawn(..., {detached: true})` delivers NO output through pipes on Windows, so every
#     `!command` was blank there. `detached` is POSIX-only now; `windowsKillArgs` already
#     handles the process tree with `taskkill /T`.
#   • the `prepare` script was a shell one-liner using `2>/dev/null` and `chmod`, neither of
#     which exists there — `pnpm install` failed outright, so nobody on Windows could install
#     from source. It is `scripts/prepare.mjs` now.
#   • `printHelp()` launched `opencode` with `execFileSync`, which cannot start a `.cmd`
#     (how npm installs it) and does not survive CRLF.
#   • temp directories are locked by a live agent child, so cleanup has to happen after the
#     server closes, not in a test's `finally`.
#   • `os.homedir()` reads `USERPROFILE` there, and `printf` does not exist.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
