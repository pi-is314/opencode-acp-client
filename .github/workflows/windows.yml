name: windows

# The unit suite on Windows, through PowerShell — GitHub's default shell on
# windows-latest. The real-TUI acceptance cannot run here (no tmux), so this job
# covers typecheck + unit tests only; see docs/COMPAT-OPENCODE.md for the platform
# notes.
#
# Why it matters: `AcpClient` has a Windows-only branch (no process groups;
# `taskkill /T` instead) and the path/quoting assumptions elsewhere are POSIX in
# spirit. A green Unix run says nothing about those.
#
# ★ NOT on push or pull_request yet. The first real run of this job (2026-11-21, on a
# fresh repository) failed 10 of 402 tests, and the failures are real Windows defects in
# the product, not just in the tests — `/cd` does not move a session, `!command`'s
# cursor paging mis-handles the shell, and the workspace directory resolution differs.
# Two were fixed on the way (`findExecutable` treated `C:\…\node.exe` as a command
# NAME and looked it up in PATH; `matchesDirectory` read only `HOME`, which Windows
# does not set). The rest are open work.
#
# Firing on every push keeps `main` permanently red, and a permanently red workflow is
# one nobody reads — which is how a real regression slips through later. Run it by hand
# (`gh workflow run windows.yml`) while chipping away at the list; restore `push` and
# `pull_request` in the same commit that makes it green.
on:
  # ★ While `fix/windows-unit-tests` is open, this branch is where the nine known failures
  # are being worked down — it needs to run on every push to that branch, and nowhere else.
  push:
    branches: ['fix/windows-unit-tests']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
